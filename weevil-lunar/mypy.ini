# Mypy configuration for the weevil-lunar package.
# Phase 3: establishes a type-check gate. Configured in non-strict mode -- it
# checks annotated code without demanding annotations everywhere, so it can be
# wired into CI immediately without a large up-front annotation effort.

[mypy]
python_version = 3.11
ignore_missing_imports = True
# Untyped function bodies are not checked yet; tighten incrementally.
check_untyped_defs = False
# warn_unused_ignores is intentionally OFF: several modules carry defensive
# `# type: ignore` comments on optional imports (yaml, simple_yaml) that are
# only redundant *given this config*. Keeping them is harmless and protects
# anyone running mypy without ignore_missing_imports.
warn_unused_ignores = False
warn_redundant_casts = True
pretty = True
