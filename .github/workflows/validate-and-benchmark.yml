name: validate-and-benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/cad-kinematics-upgrade]
  workflow_dispatch:

defaults:
  run:
    working-directory: weevil-lunar

jobs:
  validate-and-bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt -r ../requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy models/ verification/ cad/scripts/

      - name: Validate YAML schema/ranges
        run: python cad/scripts/validate_weevil_leg_params.py

      - name: Report available screw travel
        run: python cad/scripts/kinematic_report.py --output verification/reports/screw_travel.json

      - name: Regenerate FreeCAD CSVs
        run: python cad/scripts/generate_csvs_from_yaml.py

      - name: Detect CSV drift
        run: |
          git add cad/freecad_spreadsheet_template.csv cad/phase2_template_aliases.csv
          git diff --cached --quiet || (echo "CSV drift detected: commit regenerated CSVs." && exit 1)

      - name: Run unit tests
        run: python -m pytest verification/tests -q

      - name: Run backend tests
        run: python -m pytest verification/backends -q

      - name: Run verification suite (generate receipts)
        run: python verification/run_verification_suite.py

      - name: Integrated gate check (strict)
        run: python verification/run_gate_check.py --strict

      - name: Traceability receipts check
        run: python verification/sync_traceability.py --check

      - name: Run benchmark
        run: python verification/benchmark_runner.py

      - name: Check benchmark regression
        run: python verification/check_benchmark_regression.py

      - name: Regenerate export receipt (main/tag only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python cad/scripts/generate_export_receipt.py --interface-version v0.4

      - name: Check export receipt gate (main/tag only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python verification/check_export_receipt.py --receipt cad/exports/latest/export_receipt_v0.4.json --max-age-days 7

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: weevil-lunar/verification/reports/benchmark_comparison.csv
          retention-days: 7

      - name: Upload verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts
          path: |
            weevil-lunar/verification/reports/receipts.json
            weevil-lunar/verification/reports/receipts.md
            weevil-lunar/verification/reports/gate_check.csv
            weevil-lunar/verification/reports/gate_check.md
            weevil-lunar/verification/reports/phase2_export_bundle.csv
            weevil-lunar/verification/reports/screw_travel.json
            weevil-lunar/verification/traceability_sync_report.md
          retention-days: 30

      - name: Upload export receipt artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: export-receipt-v0.4
          path: |
            weevil-lunar/cad/exports/latest/export_receipt_v0.4.json
            weevil-lunar/cad/exports/latest/export_receipt_latest.json
            weevil-lunar/cad/exports/receipt.schema.json
          retention-days: 7

      - name: Upload backend comparative reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-comparative-reference
          path: weevil-lunar/verification/reference_artifacts/demo_single_leg_incline_hold_comparative_report.json
          retention-days: 30

  freecad-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and verify the tested FreeCAD runtime
        run: |
          curl -fL --retry 3 -o FreeCAD.AppImage https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          echo "f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract > /dev/null

      - name: Test native CAD and export pipeline
        run: |
          set -o pipefail
          bash cad/scripts/run_freecad_python.sh "$PWD/squashfs-root" verification/freecad/check_freecad_pipeline.py | tee freecad-validation.log

      - name: Upload FreeCAD validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-validation
          path: weevil-lunar/freecad-validation.log
          retention-days: 14

  cots-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install COTS analysis and CAD dependencies
        run: pip install -r ../requirements.txt -r ../requirements-cad.txt
      - name: Screen static loads and budgets
        run: python -m models.cots_rover --output /tmp/cots-analysis.json
      - name: Rebuild and check CAD exchange
        run: python cad/scripts/build_cots_rover.py --output /tmp/cots-cad
      - name: Upload generated COTS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cots-design-checks
          path: |
            /tmp/cots-analysis.json
            /tmp/cots-cad/
          retention-days: 30
