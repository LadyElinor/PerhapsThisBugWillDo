name: validate-and-benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: weevil-lunar

jobs:
  validate-and-bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt -r ../requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy models/ verification/ cad/scripts/

      - name: Validate YAML schema/ranges
        run: python cad/scripts/validate_weevil_leg_params.py

      - name: Regenerate FreeCAD CSVs
        run: python cad/scripts/generate_csvs_from_yaml.py

      - name: Detect CSV drift
        run: |
          git add cad/freecad_spreadsheet_template.csv cad/phase2_template_aliases.csv
          git diff --cached --quiet || (echo "CSV drift detected: commit regenerated CSVs." && exit 1)

      - name: Run unit tests
        run: python -m pytest verification/tests -q

      - name: Run backend tests
        run: python -m pytest verification/backends -q

      - name: Run verification suite (generate receipts)
        run: python verification/run_verification_suite.py

      - name: Integrated gate check (strict)
        run: python verification/run_gate_check.py --strict

      - name: Traceability receipts check
        run: python verification/sync_traceability.py --check

      - name: Run benchmark
        run: python verification/benchmark_runner.py

      - name: Check benchmark regression
        run: python verification/check_benchmark_regression.py

      - name: Regenerate export receipt (main/tag only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python cad/scripts/generate_export_receipt.py --interface-version v0.4

      - name: Check export receipt gate (main/tag only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python verification/check_export_receipt.py --receipt cad/exports/latest/export_receipt_v0.4.json --max-age-days 7

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: weevil-lunar/verification/reports/benchmark_comparison.csv
          retention-days: 7

      - name: Upload verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts
          path: |
            weevil-lunar/verification/reports/receipts.json
            weevil-lunar/verification/reports/receipts.md
            weevil-lunar/verification/reports/gate_check.csv
            weevil-lunar/verification/reports/gate_check.md
            weevil-lunar/verification/traceability_sync_report.md
          retention-days: 30

      - name: Upload export receipt artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: export-receipt-v0.4
          path: |
            weevil-lunar/cad/exports/latest/export_receipt_v0.4.json
            weevil-lunar/cad/exports/latest/export_receipt_latest.json
            weevil-lunar/cad/exports/receipt.schema.json
          retention-days: 7

      - name: Upload backend comparative reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-comparative-reference
          path: weevil-lunar/verification/reference_artifacts/demo_single_leg_incline_hold_comparative_report.json
          retention-days: 30
